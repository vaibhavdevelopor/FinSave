services:
  - type: web
    name: finsave-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CASHKARO_MAX_STORES
        value: "20"

  - type: cron
    name: finsave-offer-sync
    runtime: node
    rootDir: backend
    schedule: "0 2 * * *"
    buildCommand: npm install
    startCommand: npm run sync
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CASHKARO_MAX_STORES
        value: "20"
